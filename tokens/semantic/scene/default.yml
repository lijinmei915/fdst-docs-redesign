schema: fds-token-source/v1
global:
  layer: semantic
  tier: scene
  category: scene
  scope: global
  primitive: false
  namespace: --fds-s-
imports:
- ../base/layout.yml
- ../base/effects.yml
- ../base/typography.yml
- ../../atomic/map/spacing.yml
- ../../atomic/map/shape.yml
- ../../atomic/map/effects.yml
props:
  content-padding:
    value: '{!spacing-6}'
    type: dimension
    comment: 页面型场景内容与画布边界之间的默认留白。
  density-compact-line-height:
    value: '{!line-height-ratio-3}'
    type: number
    comment: 紧凑密度场景的相对行高，适用于高信息密度排版。
  density-compact-spacing:
    value: '{!spacing-1}'
    type: dimension
    comment: 紧凑密度场景的基础布局间距。
  density-comfortable-line-height:
    value: '{!line-height-ratio-6}'
    type: number
    comment: 舒适密度场景的相对行高，作为常规阅读节奏。
  density-comfortable-spacing:
    value: '{!spacing-2}'
    type: dimension
    comment: 舒适密度场景的基础布局间距。
  density-spacious-line-height:
    value: '{!line-height-ratio-9}'
    type: number
    comment: 宽松密度场景的相对行高，适用于强调留白和可读性的排版。
  density-spacious-spacing:
    value: '{!spacing-3}'
    type: dimension
    comment: 宽松密度场景的基础布局间距。
  card-gap:
    value: '{!spacing-3}'
    type: dimension
    comment: 页面型场景内并列或上下排列内容卡片之间的默认间距。
  card-background:
    value: '{!background-container}'
    type: color
    comment: 页面型场景中通用内容卡片的默认表面背景。
  card-border-color:
    value: '{!border-subtle}'
    type: color
    comment: 场景卡片与页面画布之间的默认弱分隔色。
  card-border-width:
    value: '{!border-width-1}'
    type: dimension
    comment: 场景卡片的默认边框宽度。
  card-radius:
    value: '{!radius-4}'
    type: dimension
    comment: 场景卡片的默认圆角，不替代 Card 组件自身的组件 Token。
  card-padding:
    value: '{!spacing-4}'
    type: dimension
    comment: 场景卡片边界与主体内容之间的默认留白。
  card-shadow:
    value: '{!shadow-none}'
    type: shadow
    comment: 场景卡片默认依靠背景和边框建立层次，不预设悬浮阴影。
  card-title-color:
    value: '{!heading-color}'
    type: color
    comment: 场景卡片标题的默认文本色。
  card-title-size:
    value: '{!heading-5-size}'
    type: dimension
    comment: 场景卡片标题的默认字号。
  card-title-line-height:
    value: '{!heading-5-line-height}'
    type: dimension
    comment: 场景卡片标题的默认行高。
  card-title-weight:
    value: '{!heading-5-weight}'
    type: font-weight
    comment: 场景卡片标题的默认字重。
  card-title-gap:
    value: '{!spacing-3}'
    type: dimension
    comment: 场景卡片标题区与主体内容之间的默认间距。
