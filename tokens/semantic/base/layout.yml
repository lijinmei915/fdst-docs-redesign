schema: fds-token-source/v1
global:
  layer: semantic
  tier: base
  category: layout
  scope: global
  primitive: false
imports:
- ./color.yml
- ../../atomic/map/spacing.yml
- ../../atomic/map/shape.yml
- ../../atomic/map/effects.yml
props:
  opacity-disabled:
    value: '{!opacity-50}'
    type: number
  background-main:
    value: '{!color-gray-3}'
    type: color
  background-container:
    value: '{!color-gray-1}'
    type: color
  background-elevated:
    value: '{!color-gray-1}'
    type: color
  background-disabled:
    value: '{!color-gray-2}'
    type: color
  background-mask:
    value: '{!color-mask}'
    type: color
  layer-base:
    value: '{!z-index-0}'
    type: number
  layer-sticky:
    value: '{!z-index-1}'
    type: number
    comment: Sticky 与固定工具栏的全局入口，使用 100-999 层级区间。
  layer-popup:
    value: '{!z-index-2}'
    type: number
    comment: Dropdown、Popover、Tooltip 等轻量浮层的全局入口，组件私有值限制在 1000-3999。
  layer-overlay:
    value: '{!z-index-3}'
    type: number
    comment: 遮罩层的全局入口，使用 4000-4999 层级区间。
  layer-modal:
    value: '{!z-index-4}'
    type: number
    comment: Modal、Drawer、Dialog 等模态交互的全局入口，组件私有值限制在 5000-8999。
  layer-feedback:
    value: '{!z-index-5}'
    type: number
    comment: Message、Toast 等必须高于模态内容的全局反馈入口，使用 9000-9999 层级区间。
